<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Bill Calculator</title>
</head>
<body>
    <form action="web.php" method="post">
        <label for="loc">Location:</label>
        <select name="loc" id="loc" required>
            <option selected disabled value="">Select area</option>
            <option>Dhaka</option>
            <option>Chatrogram</option>
        </select><br>

        <label>Area:</label>
        <input type="radio" name="area" value="Urban" required> Urban
        <input type="radio" name="area" value="Rural" required> Rural <br>

        <label for="unit">Unit Consumed:</label>
        <input type="number" name="unit" id="unit" required> <br>

        <button type="submit" style="background-color:blue;color: white;">Calculate</button>
    </form>
</body>
</html>
